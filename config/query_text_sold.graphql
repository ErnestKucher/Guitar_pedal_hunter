query Core_Marketplace_Remixer_Search($input: MarketplaceSearchInput!, $listViewEnabled: Boolean!) {
  marketplaceListingsSearch(input: $input) {
    query
    adjustedSearchUrl
    pagination {
      total
      page
      totalPages
      hasNextPage
      hasPreviousPage
      nextPageUrl
      previousPageUrl
      __typename
    }
    sorts {
      ...SearchRemixer_SortFields
      __typename
    }
    facetInfo {
      facetGroups {
        ...SearchRemixer_FacetGroupFields
        __typename
      }
      __typename
    }
    results {
      score
      __typename
    }
    listings {
      _id
      bumpKey {
        key
        __typename
      }
      ...ListingCardFields
      ...InOtherCartsCardData
      ...ListViewListings @include(if: $listViewEnabled)
      __typename
    }
    promotionInfo {
      promotionType
      __typename
    }
    queryInfo {
      ...SearchRemixer_QueryInfoFields
      __typename
    }
    __typename
  }
}

fragment SearchRemixer_FacetFields on SearchResultFacet {
  all
  key
  count
  displayName
  paramValue
  searchUrl
  selected
  subFacets {
    all
    key
    count
    displayName
    paramValue
    searchUrl
    selected
    subFacets {
      all
      key
      count
      displayName
      paramValue
      searchUrl
      selected
      subFacets {
        all
        key
        count
        displayName
        paramValue
        searchUrl
        selected
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}

